# Forever Radio dial - one line per playlist on the radio's "Input Source" knob.
#
#   Name | radio-browser search filters (key=value, quote values with spaces)
#
# Useful filters:
#   tag=jazz            genre/style tag      (radio-browser.info → Tags)
#   countrycode=US      2-letter country     (US, GB, FR, JP, DE, IE, BR ...)
#   language=french     broadcast language
#   name=bbc            station name contains
#   limit=30            how many stations (most popular first; dead ones skipped)
#
# Keep names SHORT - the TFT cuts long names off. Edit this file any time;
# the next weekly refresh (or a manual run of refresh_dial.sh) applies it.

# The radio lists playlists alphabetically, so a shared first word
# (Country, Decade, Genre ...) keeps each group together on the dial.

Country Brazil    | countrycode=BR limit=25
Country France    | countrycode=FR limit=25
Country Ireland   | countrycode=IE limit=20
Country Japan     | countrycode=JP limit=25
Country UK        | countrycode=GB limit=30
Decade 60s        | tag=60s limit=25
Decade 70s        | tag=70s limit=25
Decade 80s        | tag=80s limit=30
Decade 90s        | tag=90s limit=25
Genre Ambient     | tag=ambient limit=25
Genre Blues       | tag=blues limit=25
Genre Classical   | tag=classical limit=30
Genre Country     | tag=country countrycode=US limit=30
Genre Jazz        | tag=jazz limit=40
Genre Oldies      | tag=oldies limit=30
Genre Rock        | tag=rock limit=40
News US           | tag=news countrycode=US limit=25
Talk US           | tag=talk countrycode=US limit=25
